name: Backend CI

# Ne se déclenche que lorsque le dossier backend/ (ou ce workflow) change.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  build:
    name: Build & lint (Docker / FrankenPHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Construit l'image dev (FrankenPHP + PHP 8.5.9, identique au local)
      - name: Build image
        run: docker compose build php

      # Démarre le service php ; l'entrypoint installe les dépendances Composer,
      # --wait attend que le healthcheck soit vert.
      - name: Start php service
        run: docker compose up -d --wait php

      - name: Validate composer.json
        run: docker compose exec -T php composer validate --strict

      - name: Lint YAML config
        run: docker compose exec -T php php bin/console lint:yaml config --parse-tags

      - name: Lint DI container
        run: docker compose exec -T php php bin/console lint:container

      - name: Stop services
        if: always()
        run: docker compose down
